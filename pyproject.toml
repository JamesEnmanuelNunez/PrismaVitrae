[project]
name = "prismavitae"
version = "0.1.0"
description = "Backend FastAPI para gestión de CVs y tablas R.J.C."
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "fastapi[standard]>=0.115.0",
    "pydantic-settings>=2.0.0",
    "supabase>=2.0.0",
    "google-genai>=1.0.0",
    "openpyxl>=3.1.0",
    "httpx>=0.27.0",
    "python-multipart>=0.0.9",
]

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.24.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# B008: `Depends()` en argument defaults es el patrón idiomático de FastAPI.
ignore = ["B008"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]

[tool.fastapi]
entrypoint = "app.main:app"
